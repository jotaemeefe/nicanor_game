; Web (WebAssembly) export for the playable demo.
;
; Committed on purpose, against Godot's default .gitignore: this preset holds no
; credentials (only Android/iOS presets do), and it is the only record of how the
; published build is produced. Keys not listed here fall back to the engine's
; defaults when the preset is loaded.
;
; thread_support=false is the load-bearing choice: with threads on, the browser
; needs SharedArrayBuffer, which needs the server to send COOP/COEP headers.
; Without threads the build runs on any static host, itch.io included, with no
; server configuration at all. This game is single-threaded 2D anyway.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
